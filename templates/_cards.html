<ul class="cards">
  {% for p in projects %}
  <li class="card">
    <h3><a class="card-link" href="{{ site.base_url }}/projects/{{ p.slug }}/">{{ p.title }}</a></h3>
    <p>{{ p.summary }}</p>
    <p class="tags">{% for t in p.tags %}<span>{{ t }}</span>{% endfor %}</p>
  </li>
  {% endfor %}
</ul>
