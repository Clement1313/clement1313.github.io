[project]
name = "website"
version = "0.1.0"
description = "Personal static website built with Python"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "marimo>=0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
